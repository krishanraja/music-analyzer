[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trackcard"
version = "0.2.0"
description = "Listens to a WAV bounce locally and writes a plain-text track card an AI can read."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "scikit-learn>=1.3",
    "click>=8.1",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
stems = ["torch>=2.0", "demucs>=4.0.1"]
loudness = ["pyloudnorm>=0.1.1"]
sections = ["allin1"]
dev = ["pytest>=7.0"]

[project.scripts]
trackcard = "trackcard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real Demucs model (downloads ~80 MB once)"]
